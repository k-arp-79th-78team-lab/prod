<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理者ページ</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="footer.css">
</head>
<body>
  <main class="content">
    <h1>管理者ページ</h1>
    <p>参加者IDの割り当て状況を確認し、必要に応じてリセットできます。</p>

    <button id="refresh-status" class="big-button" type="button">状態を更新</button>
    <button id="assign-ids" class="big-button" type="button">IDをランダム割り当て</button>
    <button id="reset-assignments" class="big-button" type="button">登録・割り当てをリセット</button>

    <div style="margin-top: 24px;">
      <h2>手動割り当て</h2>
      <label for="manual-email">メールアドレス</label>
      <input id="manual-email" type="email" style="display:block; width:100%; max-width:320px; margin:8px 0 12px; padding:10px;" />
      <label for="manual-participant-id">参加者ID</label>
      <input id="manual-participant-id" type="number" min="100" max="299" style="display:block; width:100%; max-width:160px; margin:8px 0 12px; padding:10px;" />
      <button id="manual-assign" class="big-button" type="button">手動で割り当て</button>
    </div>

    <div id="status" style="margin-top: 20px;"></div>
  </main>

  <script>
    const statusBox = document.getElementById('status');

    async function loadStatus() {
      const response = await fetch('/assignments-status');
      const data = await response.json();
      statusBox.innerHTML = `
        <p>登録済みアカウント数: ${data.registeredCount}</p>
        <p>割り当て済み数: ${data.assignedCount}</p>
        <p>未割り当て数: ${data.pendingCount}</p>
        <p>100〜199: ${data.lowCount}</p>
        <p>200〜299: ${data.highCount}</p>
      `;
    }

    document.getElementById('refresh-status').addEventListener('click', loadStatus);
    document.getElementById('manual-assign').addEventListener('click', async () => {
      const email = document.getElementById('manual-email').value.trim().toLowerCase();
      const participantId = document.getElementById('manual-participant-id').value.trim();

      if (!email || !participantId) {
        alert('メールアドレスと参加者IDを入力してください。');
        return;
      }

      const response = await fetch('/admin/manual-assign', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, participantId })
      });
      const data = await response.json();
      if (data.status === 'ok') {
        alert(`ID ${data.participantId} を割り当てました。`);
        document.getElementById('manual-email').value = '';
        document.getElementById('manual-participant-id').value = '';
        loadStatus();
      } else {
        alert(data.message || '手動割り当てに失敗しました。');
      }
    });
    document.getElementById('assign-ids').addEventListener('click', async () => {
      if (!confirm('登録済みアカウントへIDを均等に割り当てますか？')) {
        return;
      }

      const response = await fetch('/admin/assign-ids', { method: 'POST' });
      const data = await response.json();
      if (data.status === 'ok') {
        alert('IDを割り当てました。');
        loadStatus();
      } else {
        alert(data.message || '割り当てに失敗しました。');
      }
    });
    document.getElementById('reset-assignments').addEventListener('click', async () => {
      if (!confirm('登録・割り当て情報をリセットしますか？')) {
        return;
      }

      const response = await fetch('/admin/reset-assignments', { method: 'POST' });
      const data = await response.json();
      if (data.status === 'ok') {
        alert('登録・割り当て情報をリセットしました。');
        loadStatus();
      }
    });

    loadStatus();
  </script>
</body>
</html>
