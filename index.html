<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    window.__APP_API_BASE_URL__ = 'https://prod-d2s3.onrender.com';
  </script>
  <title>K-ARP 79期78班</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic&family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="footer.css">
</head>
<body>
  <main class="content">
    <div class="login-container">
        <h1>ご参加いただきありがとうございます。</h1>
        <p>参加者の方は，Googleでログインしてください。</p>
        <button id="login-button" class="big-button" type="button">Googleでログイン</button>
    </div>
    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-analytics.js";
    import { getAuth, GoogleAuthProvider, getRedirectResult, signInWithRedirect } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC5i2GrXI1CF33SON2TZPAn7qT4SuG28xc",
        authDomain: "k-arp-79th-78team-c140d.firebaseapp.com",
        projectId: "k-arp-79th-78team-c140d",
        storageBucket: "k-arp-79th-78team-c140d.firebasestorage.app",
        messagingSenderId: "903991667651",
        appId: "1:903991667651:web:ce3c14fa655fd234062b76",
        measurementId: "G-H6DMRGCCB8"
    };

    const app = initializeApp(firebaseConfig);
    let analytics = null;
    try {
        analytics = getAnalytics(app);
    } catch (error) {
        console.warn('Analytics initialization skipped.', error);
    }
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    const loginButton = document.getElementById('login-button');
    const apiUrl = (path) => {
        const configuredBase = (window.__APP_API_BASE_URL__ || '').trim().replace(/\/$/, '');
        if (configuredBase) {
            return `${configuredBase}${path.startsWith('/') ? path : `/${path}`}`;
        }
        return path.startsWith('/') ? path : `/${path}`;
    };
    const appUrl = (path) => {
        return new URL(path, document.baseURI).href;
    };

    async function registerAccount(user) {
        const idToken = await user.getIdToken(true);
        const response = await fetch(apiUrl('/register-account'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${idToken}`
                    },
                    body: JSON.stringify({ displayName: user.displayName || '' })
                });

                const payload = await response.json();
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${payload.message || '登録に失敗しました。'}`);
                }

                console.log('Google login successful', user.displayName);
                const successUrl = new URL('login-success.html', document.baseURI);
                if (payload.participantId) {
                    successUrl.searchParams.set('pid', payload.participantId);
                }
                window.location.href = successUrl.href;
    }

    if (loginButton) {
        loginButton.addEventListener('click', async () => {
            loginButton.disabled = true;
            loginButton.textContent = 'Googleログインへ移動しています...';
            try {
                await signInWithRedirect(auth, provider);
            } catch (error) {
                console.error('Google login redirect failed', error);
                alert(error.message || 'ログイン画面を開けませんでした。');
                loginButton.disabled = false;
                loginButton.textContent = 'Googleでログイン';
            }
        });
    }

    getRedirectResult(auth).then((result) => {
        if (!result || !result.user) return;
        loginButton.disabled = true;
        loginButton.textContent = '登録処理中...';
        return registerAccount(result.user);
    }).catch((error) => {
        console.error('Google login result failed', error);
        alert(error.message || 'ログイン結果を処理できませんでした。');
        loginButton.disabled = false;
        loginButton.textContent = 'Googleでログイン';
    });
    </script>
  <footer class="site-footer">
    <p>Copyright © 2026 神奈川県立鎌倉高等学校 K-ARP 79期78班 All Rights Reserved.</p>
  </footer>
</body>
</html>
