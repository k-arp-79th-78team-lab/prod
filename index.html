<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-ARP 79期78班</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic&family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="footer.css">
</head>
<body>
  <main class="content">
    <section id="pid-input-area">
      <h1>参加者IDを入力してください</h1>
      <div class="input-row">
        <label for="pid" class="visually-hidden">参加者ID</label>
        <input id="pid" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="参加者IDを入力">
        <button id="pid-submit" type="button" class="big-button">送信</button>
      </div>
    </section>

    <button id="start" type="button" class="big-button hidden">回答開始</button>
    <section id="quiz" class="hidden" aria-live="polite"></section>
    <button id="finish" type="button" class="big-button hidden">回答終了</button>
  </main>

  <script src="script.js"></script>

  <footer class="site-footer">
    <p>Copyright © 2026 神奈川県立鎌倉高等学校 K-ARP 79期78班 All Rights Reserved.</p>
  </footer>
</body>
</html>
