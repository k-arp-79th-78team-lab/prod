<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-ARP 79期78班</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic&family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="footer.css">
</head>
<body>
  <main class="content">
    <div class="login-container">
        <h1>ご参加いただきありがとうございます。</h1>
        <p>参加者の方は，Googleでログインしてください。</p>
        <button id="login-button" class="big-button" type="button">Googleでログイン</button>
    </div>
    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-analytics.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC5i2GrXI1CF33SON2TZPAn7qT4SuG28xc",
        authDomain: "k-arp-79th-78team-c140d.firebaseapp.com",
        projectId: "k-arp-79th-78team-c140d",
        storageBucket: "k-arp-79th-78team-c140d.firebasestorage.app",
        messagingSenderId: "903991667651",
        appId: "1:903991667651:web:ce3c14fa655fd234062b76",
        measurementId: "G-H6DMRGCCB8"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    const loginButton = document.getElementById('login-button');

    if (loginButton) {
        loginButton.addEventListener('click', async () => {
            loginButton.disabled = true;
            loginButton.textContent = 'ログイン処理中...';

            try {
                const result = await signInWithPopup(auth, provider);
                console.log('Google login successful', result.user.displayName);
                window.location.href = 'test.html';
            } catch (error) {
                console.error('Google login failed', error);
                alert('ログインに失敗しました。しばらくしてからもう一度お試しください。');
                loginButton.disabled = false;
                loginButton.textContent = 'Googleでログイン';
            }
        });
    }
    </script>
  <footer class="site-footer">
    <p>Copyright © 2026 神奈川県立鎌倉高等学校 K-ARP 79期78班 All Rights Reserved.</p>
  </footer>
</body>
</html>
